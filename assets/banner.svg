  <style>
    .name { font: 700 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: fade .8s ease-out both; }
    .tagline { font: 400 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; letter-spacing: .5px; animation: rise .6s ease-out 1.5s both; }
    .label { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0d1117; }
    .box { fill: none; stroke: #39d353; stroke-width: 3; stroke-dasharray: 1148; animation: draw 1.1s ease-out .3s both; }
    .handle { fill: #0d1117; stroke: #39d353; stroke-width: 2; animation: fade .4s ease-out 1.3s both; }
    .tag { animation: fade .4s ease-out 1.2s both; }
    @keyframes draw { from { stroke-dashoffset: 1148; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
